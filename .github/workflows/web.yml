# Builds the Web export on every push to main and publishes it to GitHub Pages.
# Play at https://<user>.github.io/<repo>/
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Must match the editor the project is made with (Help > About in Godot).
  GODOT_RELEASE: 4.8-beta2      # tag in godotengine/godot-builds
  GODOT_TEMPLATES: 4.8.beta2    # export_templates folder name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES }}
          key: godot-${{ env.GODOT_RELEASE }}-web

      - name: Download Godot and the web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/$GODOT_TEMPLATES
          mkdir -p "$dest"
          # only the web templates are needed (the full archive is ~1.3 GB)
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dest"
          ls -la "$dest"

      - name: Import assets
        run: ~/godot/godot --headless --import --path . || true

      - name: Export Web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.pck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
